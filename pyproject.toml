[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tychelabs-uk-business-check"
version = "1.1.0"
description = "UK business check API client - Companies House, HMRC VAT number validation and charity status in one call, with risk flags."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Tyche Labs Ltd", email = "info@tychelabs.net" }]
keywords = ["companies-house", "vat", "hmrc", "kyb", "company-check", "uk"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent"]

[project.urls]
Homepage = "https://api.tychelabs.net"
Documentation = "https://api.tychelabs.net/docs"
Source = "https://github.com/Tyche-Network/uk-business-check-python"

[tool.setuptools]
packages = ["uk_business_check"]
